stages:
  - preflight
  - terraform-plan
  - terraform-apply
  - k8s-plan
  - k8s-apply

default:
  tags:
    - infra

.ssh:
  before_script:
    - IFS=
    - mkdir ~/.ssh
    - touch ~/.ssh/known_hosts
    - echo $C0_SSH_KNOWN_HOSTS >> ~/.ssh/known_hosts
    - eval `ssh-agent -s`
    - echo "$C0_PIPELINE_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh/sockets
    - |
      cat >> ~/.ssh/config <<EOF
      Host *
        ConnectionAttempts 3
        ServerAliveInterval 15
        ServerAliveCountMax 3
        ControlMaster auto
        ControlPath ~/.ssh/sockets/%r@%h-%p
        ControlPersist 120
      EOF

.tf:
  image: registry.gitlab.com/gitlab-org/terraform-images/stable:latest
  before_script:
    - cd $TF_ROOT

.tf-plan:
  extends:
    - .tf
  stage: terraform-plan
  resource_group: tf/$TF_STATE_NAME
  script:
    - gitlab-terraform plan $TF_ARGS | tee output
    - gitlab-terraform plan-json
    - |
      echo -e "\e[0Ksection_start:`date +%s`:glpa_summary\r\e[0KHeader of the summary"
      grep -E "Plan:|No changes" output | sed -r "s/[[:cntrl:]]\[[0-9]{1,3}m//g"
      echo -e "\e[0Ksection_end:`date +%s`:glpa_summary\r\e[0K"
  artifacts:
    expire_in: 7 days
    paths:
      - $TF_ROOT/plan.cache
    reports:
      terraform: $TF_ROOT/plan.json

.tf-apply:
  extends:
    - .tf
  stage: terraform-apply
  resource_group: tf/$TF_STATE_NAME
  script:
    - gitlab-terraform apply $TF_ARGS | tee output
    - |
      echo -e "\e[0Ksection_start:`date +%s`:glpa_summary\r\e[0KHeader of the summary"
      grep "Apply complete!" output | sed -r "s/[[:cntrl:]]\[[0-9]{1,3}m//g"
      echo -e "\e[0Ksection_end:`date +%s`:glpa_summary\r\e[0K"
  environment:
    name: $TF_STATE_NAME
    deployment_tier: production
  rules:
    - if: $C0_GH_REF == "refs/heads/main"
      when: delayed
      start_in: 2 min

regeneration-check:signoz:
  stage: preflight
  image: ghcr.io/code0-tech/build-images/mise:428.1
  script:
    - cd modules/docker/signoz
    - mise install
    - mise x -- signoz-foundry forge
    - git add .
    - git diff --exit-code --staged

push-artifact:teleport-config:
  stage: preflight
  image:
    name: ghcr.io/code0-tech/build-images/mise:428.1
    entrypoint: [""]
  script:
    - mise install
    - TAG=$(find manifests/teleport-config -type f | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
    - >
      flux push artifact
      oci://registry.gitlab.com/code0-tech/infrastructure/mensa/teleport-config:${TAG}
      --path=manifests/teleport-config
      --source="${CI_PROJECT_URL}"
      --revision="${CI_COMMIT_SHA}"
      --creds="gitlab-ci-token:${CI_JOB_TOKEN}"
    - echo "TF_VAR_teleport_config_tag=${TAG}" > teleport-config.env
  artifacts:
    reports:
      dotenv: teleport-config.env

tf-plan:main:
  extends:
    - .tf-plan
  variables:
    TF_STATE_NAME: main
    TF_ROOT: 'envs/main'

tf-apply:main:
  extends:
    - .tf-apply
  needs:
    - tf-plan:main
  variables: !reference ["tf-plan:main", variables]

tf-plan:github:
  extends:
    - .tf-plan
  variables:
    TF_STATE_NAME: github
    TF_ROOT: 'envs/github'
    TF_ARGS: '-refresh=false'
  rules:
    - if: $C0_GH_REF == "refs/heads/main"
      variables:
        TF_ARGS: ''
    - when: on_success

tf-apply:github:
  extends:
    - .tf-apply
  needs:
    - tf-plan:github
  variables: !reference ["tf-plan:github", variables]

tf-plan:server_administration:
  extends:
    - .tf-plan
  before_script:
    - !reference [.ssh, before_script]
    - !reference [.tf, before_script]
  variables:
    TF_STATE_NAME: server_administration
    TF_ROOT: 'envs/server_administration'
    TF_ARGS: '-parallelism=1'

tf-apply:server_administration:
  extends:
    - .tf-apply
  before_script: !reference [tf-plan:server_administration, before_script]
  needs:
    - tf-plan:server_administration
  variables: !reference [tf-plan:server_administration, variables]

tf-plan:server_staging:
  extends:
    - .tf-plan
  before_script:
    - echo > modules/docker/codezero/override.env # ensure this file exists for docker_compose resource
    - echo > modules/docker/signoz/override.env # ensure this file exists for docker_compose resource
    - !reference [.ssh, before_script]
    - !reference [.tf, before_script]
  variables:
    TF_STATE_NAME: server_staging
    TF_ROOT: 'envs/server_staging'
    TF_ARGS: '-parallelism=1'

tf-apply:server_staging:
  extends:
    - .tf-apply
  before_script: !reference [tf-plan:server_staging, before_script]
  needs:
    - tf-plan:server_staging
  variables: !reference [tf-plan:server_staging, variables]

tf-plan:k3s_administration:
  extends:
    - .tf-plan
  before_script:
    - !reference [.ssh, before_script]
    - !reference [.tf, before_script]
  variables:
    TF_STATE_NAME: k3s_administration
    TF_ROOT: 'envs/k3s_administration'
    TF_ARGS: '-parallelism=1'

tf-apply:k3s_administration:
  extends:
    - .tf-apply
  before_script: !reference [tf-plan:k3s_administration, before_script]
  needs:
    - tf-plan:k3s_administration
  variables: !reference [tf-plan:k3s_administration, variables]

tf-plan:k8s_administration:
  extends:
    - .tf-plan
  stage: k8s-plan
  variables:
    TF_STATE_NAME: k8s_administration
    TF_ROOT: 'envs/k8s_administration'
    TF_VAR_kubeconfig_path: $KUBECONFIG
    TF_VAR_kubeconfig_context: code0-tech/infrastructure/mensa:k3s-administration

tf-apply:k8s_administration:
  extends:
    - .tf-apply
  stage: k8s-apply
  needs:
    - tf-plan:k8s_administration
  variables: !reference ["tf-plan:k8s_administration", variables]
